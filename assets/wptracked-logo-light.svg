<svg xmlns="http://www.w3.org/2000/svg" width="380" height="72" viewBox="0 0 380 72" role="img" aria-label="WPTracked by Varry LLC">
  <defs>
    <linearGradient id="wptl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>
  <!-- Mark: rounded square (light border for dark bg) with tracking pulse line -->
  <rect x="2" y="6" width="60" height="60" rx="14" fill="rgba(255,255,255,0.08)"
        stroke="#2DD4BF" stroke-width="1.5"/>
  <polyline points="12,44 22,44 28,26 36,52 42,36 52,36" fill="none"
