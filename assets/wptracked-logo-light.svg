  <circle cx="52" cy="36" r="4.5" fill="#f4ebd9"/>
  <!-- Wordmark (light for the dark rust header) -->
  <text x="76" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30"
        font-weight="700" fill="#FFFFFF">WP<tspan fill="#e6b877">Tracked</tspan></text>
  <text x="77" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12"
        letter-spacing="2.5" fill="#e5d5b7">BY VARRY LLC</text>
</svg>
