  <circle cx="52" cy="36" r="4.5" fill="#5EEAD4"/>
  <!-- Wordmark (white for dark headers) -->
  <text x="76" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30"
        font-weight="700" fill="#FFFFFF">WP<tspan fill="#5EEAD4">Tracked</tspan></text>
  <text x="77" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12"
        letter-spacing="2.5" fill="#AEB9CC">BY VARRY LLC</text>
</svg>
